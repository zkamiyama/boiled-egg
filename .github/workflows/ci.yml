name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        cxx: [20, 23]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsndfile1
          python3 -m pip install --user -r requirements-dev.txt
      - name: Configure
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == clang ]]; then
            export CC=clang CXX=clang++
          else
            export CC=gcc CXX=g++
          fi
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build-ci --parallel 2
      - name: Unit tests
        run: ctest --test-dir build-ci --output-on-failure
      - name: ABI export check
        run: scripts/check_exports.sh build-ci/libboiled_egg.so
      - name: Installed consumer smoke test
        run: scripts/test_install_consumer.sh build-ci
      - name: Synthetic evaluation smoke test
        run: |
          python3 eval/generate_corpus.py
          python3 eval/run_synthetic.py --cli build-ci/boiled_egg_cli

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: ASan + UBSan
        run: |
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBOILED_EGG_SANITIZE=ON
          cmake --build build-san --parallel 2
          ctest --test-dir build-san --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++
      - name: TSan concurrency contract
        run: |
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBOILED_EGG_THREAD_SANITIZE=ON -DBOILED_EGG_BUILD_TOOLS=OFF -DBOILED_EGG_BUILD_BENCH=OFF
          cmake --build build-tsan --parallel 2
          ctest --test-dir build-tsan --output-on-failure -R 'boiled_egg_(threading|daw_host)_test'

  clap-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build git
      - name: Build self-contained CLAP 1.2.10 adapter
        run: |
          cmake -S . -B build-clap -G Ninja -DCMAKE_BUILD_TYPE=Release -DBOILED_EGG_BUILD_SHARED=OFF -DBOILED_EGG_BUILD_CLAP=ON -DBOILED_EGG_BUILD_TOOLS=OFF -DBOILED_EGG_BUILD_BENCH=OFF
          cmake --build build-clap --parallel 2
      - name: Load and exercise plugin through CLAP ABI
        run: ctest --test-dir build-clap --output-on-failure -R boiled_egg_clap_smoke
      - name: Verify CLAP entry and self-contained core
        shell: bash
        run: |
          nm -D build-clap/adapters/clap/boiled_egg.clap | grep -E ' [BDR] clap_entry$'
          if ldd build-clap/adapters/clap/boiled_egg.clap | grep -q 'libboiled_egg'; then
            echo 'CLAP plugin unexpectedly depends on external libboiled_egg' >&2
            exit 1
          fi

  vst3-adapter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build git
      - name: Configure VST3 SDK 3.8.0 adapter
        run: |
          cmake -S . -B build-vst3 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBOILED_EGG_BUILD_SHARED=OFF -DBOILED_EGG_BUILD_VST3=ON -DBOILED_EGG_BUILD_TESTS=OFF -DBOILED_EGG_BUILD_TOOLS=OFF -DBOILED_EGG_BUILD_BENCH=OFF
      - name: Build plugin and run Steinberg validator
        run: cmake --build build-vst3 --target boiled_egg_vst3 --parallel 2
      - name: Verify VST3 package metadata and self-contained core
        shell: bash
        run: |
          PLUGIN_DIR="$(find build-vst3 -type d -name 'boiled egg.vst3' -print -quit)"
          test -n "$PLUGIN_DIR"
          test -f "$PLUGIN_DIR/Contents/Resources/moduleinfo.json"
          PLUGIN_BIN="$(find "$PLUGIN_DIR" -type f -name '*.so' -print -quit)"
          test -n "$PLUGIN_BIN"
          if ldd "$PLUGIN_BIN" | grep -q 'libboiled_egg'; then
            echo 'VST3 plugin unexpectedly depends on external libboiled_egg' >&2
            exit 1
          fi

  static-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure and build static SDK
        run: |
          cmake -S . -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release -DBOILED_EGG_BUILD_SHARED=OFF
          cmake --build build-static --parallel 2
          ctest --test-dir build-static --output-on-failure
      - name: Installed C/C++ consumer smoke test
        run: scripts/test_install_consumer.sh build-static
