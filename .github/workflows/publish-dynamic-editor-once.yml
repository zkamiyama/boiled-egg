# Temporary hash-bound source transfer. No workflow mutation by GITHUB_TOKEN.
name: publish-dynamic-editor-once
on:
  push:
    branches: ['feature/dynamic-pitch-editor']
    paths: ['.github/workflows/publish-dynamic-editor-once.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'zkamiyama/boiled-egg' && github.ref == 'refs/heads/feature/dynamic-pitch-editor'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reconstruct only hash-verified ordinary source from repository blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = bc9f09f79ece3e65e44c01bede3d8f37e2051cd3
          mkdir publication-validation
          python - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          groups=[
            ('2572dcd266d95b137dbfd18d6ff0147c1e825c7a','55bdcc06d52e7dfb2fbbc7c68b5c5c15e2c4e04c2981442cc5aefbd7ff054940'),
            ('efbed13657b0ccb2bdb4151fb12913be85c4419a','95f0570d0500196d4facdbcc9d8ad3f890c783336751e208622c023178175e2d'),
            ('9eafb6584e8c2e0477b85807b79ec98255befe9d','0a8f8bad122a280f8636739717fe698095cbc74f7f98dcf2a9ca7c87db631d06')]
          for i,(sha,wanted) in enumerate(groups):
            response=json.loads(subprocess.check_output(['gh','api','repos/zkamiyama/boiled-egg/git/blobs/'+sha]))
            packed=base64.b64decode(response['content'])
            assert hashlib.sha1(b'blob '+str(len(packed)).encode()+b'\0'+packed).hexdigest()==sha
            raw=lzma.decompress(packed)
            assert hashlib.sha256(raw).hexdigest()==wanted, 'source transfer hash mismatch'
            group=json.loads(raw)
            # Workflow creation/removal belongs to the separately authorized
            # connector, not this source-only contents token.
            group['files'].pop('.github/workflows/dynamic-pitch-editor.yml',None)
            for name,entry in group['files'].items():
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts and not p.is_symlink()
              assert name=='CMakeLists.txt' or name.startswith(('adapters/','cmake/','quality/dynamic_pitch/'))
              current=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert current==entry['before_sha256'], 'unexpected source at '+name
            for name,entry in group['files'].items():
              p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(entry['content'],encoding='utf-8')
            subprocess.run(['git','add','--',*group['files']],check=True)
            subprocess.run(['git','diff','--cached','--check'],check=True)
            subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m',group['message']],check=True)
          PY
      - name: Rebuild exact staged public SDK and test before publishing
        run: |
          cmake -S . -B build-publication -DCMAKE_BUILD_TYPE=Release \
            -DBOILED_EGG_ENABLE_EXPERIMENTAL_SPECTRAL=ON -DCMAKE_CXX_STANDARD=20
          cmake --build build-publication -j2
          ctest --test-dir build-publication --output-on-failure | tee publication-validation/ctest.log
      - name: Publish ordinary source to this branch only
        run: |
          git rev-parse HEAD > publication-validation/COMMIT.txt
          git rev-parse HEAD^{tree} > publication-validation/TREE.txt
          git ls-files -z | xargs -0 sha256sum > publication-validation/SOURCE_SHA256SUMS
          git archive --format=tar.gz --prefix=boiled-egg/ HEAD > publication-validation/source.tar.gz
          git log -5 --format='%H %s' > publication-validation/COMMITS.txt
          git push origin HEAD:refs/heads/feature/dynamic-pitch-editor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-dynamic-editor-source
          path: publication-validation/
          retention-days: 7
