name: calibrated-listening
on:
  push:
    paths: ['eval/candidate_evidence.py', 'eval/calibrated_listening.py', 'eval/test_calibrated_listening.py', 'eval/test_candidate_integration.py', 'eval/listening_results.py', 'eval/test_listening_results.py', 'eval/comparison_contract.py', 'eval/test_request_numbers.py', '.github/workflows/calibrated-listening.yml']
  pull_request:
    paths: ['eval/**', '.github/workflows/calibrated-listening.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
jobs:
  eligibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencies and unchanged product regression
        run: |
          mkdir validation
          sudo apt-get update
          sudo apt-get install -y libsndfile1 librubberband2
          python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1
          python -m pip freeze > validation/PYTHON_VERSIONS.txt
          dpkg-query -W librubberband2 libsndfile1 > validation/REFERENCE_VERSIONS.txt
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure 2>&1 | tee validation/product-tests.log
      - name: Reject invalid evidence and run real calibrated panel
        run: |
          PYTHONPATH=eval python -W error::ResourceWarning -m unittest -v test_calibrated_listening test_listening_results test_request_numbers 2>&1 | tee validation/unit.log
          BOILED_EGG_CLI="$PWD/build/boiled_egg_cli" \
          BOILED_EGG_RB_LIBRARY=/usr/lib/x86_64-linux-gnu/librubberband.so.2 \
          BOILED_EGG_LISTENING_RESULTS="$PWD/validation/integration" \
            python -W error::ResourceWarning eval/test_candidate_integration.py 2>&1 | tee validation/integration.log
      - name: Record source identity
        if: always()
        run: |
          mkdir -p validation
          git rev-parse HEAD > validation/COMMIT.txt
          git rev-parse HEAD^{tree} > validation/TREE.txt
          git ls-files -z | xargs -0 sha256sum > validation/SOURCE_SHA256SUMS
          git archive --format=tar.gz --prefix=boiled-egg/ HEAD > validation/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibrated-listening-${{ matrix.python }}-${{ github.sha }}
          path: validation/
          if-no-files-found: error
          retention-days: 7
