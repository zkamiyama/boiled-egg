# Temporary, branch-scoped transfer of a locally tested source diff.
# This workflow is removed after the verified source commit is published.
name: integrate-dynamic-core-once
on:
  push:
    branches: ['feature/dynamic-pitch-editor']
    paths: ['quality/dynamic_stage/**', '.github/workflows/integrate-dynamic-core-once.yml']
permissions:
  contents: write
jobs:
  apply-verified-source:
    if: github.repository == 'zkamiyama/boiled-egg' && github.ref == 'refs/heads/feature/dynamic-pitch-editor'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and apply exactly the reviewed source delta
        run: |
          mkdir -p core-validation
          cat quality/dynamic_stage/0*.b64 | base64 --decode | gzip --decompress > core-validation/source.patch
          echo '807474dd51856d4d8420327b940d9a4a65c30e2f5c68fba16407df7b141ba91c  core-validation/source.patch' | sha256sum --check
          git apply --check --index core-validation/source.patch
          git apply --index core-validation/source.patch
          git diff --cached --check
      - name: Rebuild and test the actual staged source
        run: |
          cmake -S . -B build-dynamic -DCMAKE_BUILD_TYPE=Release -DBOILED_EGG_ENABLE_EXPERIMENTAL_SPECTRAL=ON -DCMAKE_CXX_STANDARD=20
          cmake --build build-dynamic -j2
          ctest --test-dir build-dynamic --output-on-failure | tee core-validation/ctest.log
      - name: Publish tested source to the same feature branch only
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Implement continuous source-clock pitch mapping and fixed-delay public SDK controls'
          git rev-parse HEAD > core-validation/COMMIT.txt
          git rev-parse HEAD^{tree} > core-validation/TREE.txt
          git ls-files -z | xargs -0 sha256sum > core-validation/SOURCE_SHA256SUMS
          git push origin HEAD:refs/heads/feature/dynamic-pitch-editor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-core-staged-validation
          path: core-validation/
          retention-days: 7
