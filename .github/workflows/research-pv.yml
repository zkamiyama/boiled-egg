name: research-pv

on:
  push:
    paths:
      - "research/cpp_pv_rt/**"
      - "research/*.py"
      - "eval/tsm_dataset.py"
      - ".github/workflows/research-pv.yml"
  pull_request:
    paths:
      - "research/**"
      - "eval/**"
      - ".github/workflows/research-pv.yml"

jobs:
  cpp-streaming-pv:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        standard: [20, 23]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S research/cpp_pv_rt -B build/research-pv -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.standard }}
      - name: Build
        run: cmake --build build/research-pv --parallel 2
      - name: Tests
        run: ctest --test-dir build/research-pv --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S research/cpp_pv_rt -B build/research-pv-asan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build and test
        run: |
          cmake --build build/research-pv-asan --parallel 2
          ctest --test-dir build/research-pv-asan --output-on-failure

  pitch-formant-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsndfile1
          python3 -m pip install --user -r requirements-dev.txt
      - name: Build research renderers and benchmarks
        run: |
          cmake -S research/cpp_pv_rt -B build/formant -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/formant --target \
            boiled_egg_pv_rt_cli \
            boiled_egg_pv_rt_formant_bench \
            boiled_egg_pv_rt_window_bench \
            boiled_egg_multires_rt_cli \
            boiled_egg_multires_rt_bench \
            --parallel 2
      - name: Pitch, duration, stereo and spectral-envelope regression
        run: python3 research/eval_formant_pitch.py --cli build/formant/boiled_egg_pv_rt_cli --output results/formant-ci
      - name: Transient profile tonal safety gate
        run: >-
          python3 research/test_transient_candidate.py
          --cli build/formant/boiled_egg_pv_rt_cli
          --output results/transient-tonal
          --diagnostic-fft 512
          --diagnostic-fft 2048
      - name: Multi-resolution tonal safety gate
        run: >-
          python3 research/test_multires_candidate.py
          --cli build/formant/boiled_egg_multires_rt_cli
          --output results/multires-tonal
      - name: General callback diagnostic and gross regression gate
        run: |
          build/formant/boiled_egg_pv_rt_formant_bench > results/formant-callback.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path('results/formant-callback.csv').open()))
          worst=max(float(r['p99_deadline_ratio']) for r in rows)
          print('worst general formant p99/deadline', worst)
          # Absolute hosted-runner p99 is archived as a diagnostic. Fail only
          # on a gross regression; use same-VM relative gates below for profile
          # comparisons.
          if worst >= 1.50:
              raise SystemExit('gross general callback regression')
          PY
      - name: Window and hop callback diagnostic and relative gate
        run: |
          build/formant/boiled_egg_pv_rt_window_bench > results/window-callback.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path('results/window-callback.csv').open()))
          worst={}
          for key in sorted({(int(r['fft']), int(r['hop'])) for r in rows}):
              fft, hop=key
              group=[r for r in rows if int(r['fft']) == fft and int(r['hop']) == hop]
              item=max(group,key=lambda r: float(r['p99_deadline_ratio']))
              worst[key]=float(item['p99_deadline_ratio'])
              print('fft/hop', f'{fft}/{hop}', 'worst p99/deadline', item['p99_deadline_ratio'], 'at', item['sample_rate'], 'Hz /', item['block'], 'frames')
          general=worst[(2048,256)]
          legacy=worst[(1024,128)]
          transient=worst[(1024,256)]
          vs_general=transient / max(general, 1.0e-9)
          vs_legacy=transient / max(legacy, 1.0e-9)
          print('Transient 1024/256 vs General 2048/256', vs_general)
          print('Transient 1024/256 vs old 1024/128 candidate', vs_legacy)
          if vs_general > 1.25:
              raise SystemExit('Transient profile realtime cost regressed relative to General')
          if vs_legacy > 1.25:
              raise SystemExit('Transient 256-hop cost regressed relative to 128-hop candidate')
          if transient > 1.50:
              raise SystemExit('gross Transient callback regression')
          PY
      - name: Multi-resolution callback CPU diagnostic and gross gate
        run: |
          build/formant/boiled_egg_multires_rt_bench > results/multires-callback.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path('results/multires-callback.csv').open()))
          cpu=max(rows,key=lambda r: float(r['cpu_p99_deadline_ratio']))
          wall=max(rows,key=lambda r: float(r['wall_p99_deadline_ratio']))
          print('worst multi-resolution CPU p99/deadline', cpu['cpu_p99_deadline_ratio'], 'at', cpu['sample_rate'], 'Hz /', cpu['block'], 'frames / pitch', cpu['pitch_ratio'])
          print('worst multi-resolution wall p99/deadline', wall['wall_p99_deadline_ratio'], 'at', wall['sample_rate'], 'Hz /', wall['block'], 'frames / pitch', wall['pitch_ratio'])
          # Hosted runner p99 is noisy; CPU time removes scheduler wait but still
          # varies with VM frequency/cache state. This is a gross regression gate,
          # while repeated pinned development runs are used for promotion decisions.
          if float(cpu['cpu_p99_deadline_ratio']) >= 1.50:
              raise SystemExit('gross multi-resolution CPU callback regression')
          if float(wall['wall_p99_deadline_ratio']) >= 1.75:
              raise SystemExit('gross multi-resolution wall callback regression')
          PY
      - name: Upload Linux renderers, source and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formant-linux-x64
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/formant/boiled_egg_pv_rt_cli
            build/formant/boiled_egg_multires_rt_cli
            results/formant-ci/report.json
            results/transient-tonal/metrics.csv
            results/multires-tonal/metrics.csv
            results/formant-callback.csv
            results/window-callback.csv
            results/multires-callback.csv
            research/cpp_pv_rt/**
            research/eval_formant_pitch.py
            research/eval_elastique_pitch.py
            research/eval_multiresolution.py
            research/make_blind_pitch_pack.py
            research/make_blind_profile_pack.py
            research/test_transient_candidate.py
            research/test_multires_candidate.py
            research/formant_reference.py
            research/test_formant_reference.py

  python-reference-formant:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1
          python3 -m pip install --user -r requirements-dev.txt
      - name: Compile research Python
        run: >-
          python3 -m py_compile
          research/pv_reference.py
          research/formant_reference.py
          research/test_formant_reference.py
          research/eval_formant_pitch.py
          research/eval_elastique_pitch.py
          research/eval_multiresolution.py
          research/make_blind_pitch_pack.py
          research/make_blind_profile_pack.py
          research/test_transient_candidate.py
          research/test_multires_candidate.py
      - name: Independent offline strategy regression
        working-directory: research
        run: python3 -m unittest -v test_formant_reference.py
