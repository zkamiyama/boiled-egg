name: research-pv

on:
  push:
    paths:
      - "research/cpp_pv_rt/**"
      - "research/*.py"
      - "eval/tsm_dataset.py"
      - "eval/test_tsm_dataset.py"
      - ".github/workflows/research-pv.yml"
  pull_request:
    paths:
      - "research/**"
      - "eval/**"
      - ".github/workflows/research-pv.yml"

jobs:
  cpp-streaming-pv:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        standard: [20, 23]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S research/cpp_pv_rt -B build/research-pv -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.standard }}
      - name: Build
        run: cmake --build build/research-pv --parallel 2
      - name: Tests
        run: ctest --test-dir build/research-pv --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S research/cpp_pv_rt -B build/research-pv-asan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build and test
        run: |
          cmake --build build/research-pv-asan --parallel 2
          ctest --test-dir build/research-pv-asan --output-on-failure

  pitch-formant-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsndfile1
          python3 -m pip install --user -r requirements-dev.txt
      - name: Build research renderer
        run: |
          cmake -S research/cpp_pv_rt -B build/formant -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/formant --target boiled_egg_pv_rt_cli boiled_egg_pv_rt_formant_bench --parallel 2
      - name: Pitch and spectral-envelope regression
        run: python3 research/eval_formant_pitch.py --cli build/formant/boiled_egg_pv_rt_cli --output results/formant-ci
      - name: Callback p99 deadline gate
        run: |
          build/formant/boiled_egg_pv_rt_formant_bench > results/formant-callback.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path
          rows=list(csv.DictReader(Path('results/formant-callback.csv').open()))
          worst=max(float(r['p99_deadline_ratio']) for r in rows)
          print('worst formant p99/deadline', worst)
          if worst >= 0.90:
              raise SystemExit('formant callback p99 gate failed')
          PY

  python-research-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1
          python3 -m pip install --user -r requirements-dev.txt
      - name: Compile Python tools
        run: >-
          python3 -m py_compile
          eval/tsm_dataset.py
          eval/import_tsm_dataset.py
          eval/run_tsm_benchmark.py
          research/pv_reference.py
          research/run_pv_experiment.py
          research/run_cpp_pv_rt_experiment.py
          research/tune_cpp_pv_rt.py
          research/transient_graft.py
          research/run_transient_graft_experiment.py
          research/eval_formant_pitch.py
      - name: Generated mini-dataset test
        run: python3 -m unittest -v eval/test_tsm_dataset.py
