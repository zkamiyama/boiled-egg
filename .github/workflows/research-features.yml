name: research-features

on:
  push:
    paths: ['research/**', 'requirements-dev.txt', '.github/workflows/research-features.yml']
  pull_request:
    paths: ['research/**', 'requirements-dev.txt', '.github/workflows/research-features.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1

jobs:
  feature-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build C and C++ research tests
        run: |
          mkdir validation
          cmake -S research/cpp_pv_rt -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure 2>&1 | tee validation/ctest.log
      - name: Calibrated feature integration
        run: |
          export BOILED_EGG_PV_CLI="$PWD/build/boiled_egg_pv_rt_cli"
          export BOILED_EGG_MULTIRES_CLI="$PWD/build/boiled_egg_multires_rt_cli"
          python -W error::ResourceWarning -m unittest -v research/test_research_features.py 2>&1 | tee validation/features.log
          python research/check_feature_quality.py --build "$PWD/build" --output validation/tonal.json
      - name: Exact source and executable provenance
        if: always()
        run: |
          mkdir -p validation
          git archive --format=tar.gz --prefix=boiled-egg/ HEAD > validation/source.tar.gz
          git rev-parse HEAD > validation/COMMIT.txt
          git rev-parse HEAD^{tree} > validation/TREE.txt
          git ls-tree -r HEAD > validation/TRACKED_FILES.txt
          git ls-files -z | xargs -0 sha256sum > validation/SOURCE_SHA256SUMS
          if test -f build/boiled_egg_pv_rt_cli; then
            sha256sum build/boiled_egg_pv_rt_cli build/boiled_egg_multires_rt_cli > validation/RENDERER_SHA256SUMS
          fi
          (cd validation && sha256sum source.tar.gz COMMIT.txt TREE.txt TRACKED_FILES.txt SOURCE_SHA256SUMS > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-feature-validation-${{ github.sha }}
          path: validation/
          if-no-files-found: error
          retention-days: 7
