name: research-phase-innovation
on:
  push:
    paths:
      - 'research/cpp_pv_rt/**'
      - 'research/experiments/fuzzy*patch'
      - 'research/experiments/phase_innovation_guard_test.cpp'
      - 'research/eval_innovation_confirmation.py'
      - 'research/summarize_phase_innovation.py'
      - 'research/test_phase_innovation_study.py'
      - 'requirements-dev.txt'
      - '.github/workflows/research-phase-innovation.yml'
  pull_request:
    paths: ['research/**', 'requirements-dev.txt', '.github/workflows/research-phase-innovation.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
jobs:
  isolated-innovation:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply the complete opt-in patch chain
        run: |
          mkdir validation
          git rev-parse HEAD > validation/COMMIT.txt
          git apply research/experiments/fuzzy_coherence_guard.patch
          git apply research/experiments/fuzzy_coherence_guard_alias_fix.patch
          git apply research/experiments/fuzzy_phase_owner_refinement.patch
          git apply research/experiments/fuzzy_phase_innovation.patch
          git diff --binary > validation/applied.patch
          git ls-files -z | xargs -0 sha256sum > validation/PATCHED_SOURCE_SHA256SUMS
      - name: Build and run numerical and integration tests
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          if test "$COMPILER" = clang; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          python -m pip install -r requirements-dev.txt
          cmake -S research/cpp_pv_rt -B build-innovation -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_FLAGS=-DBOILED_EGG_EXPERIMENT_COHERENCE_GUARD=1
          cmake --build build-innovation -j 2
          ctest --test-dir build-innovation --output-on-failure 2>&1 | tee validation/ctest.log
          "$CXX" -O2 -std=c++20 research/experiments/phase_innovation_guard_test.cpp -o build-innovation/innovation-test
          build-innovation/innovation-test | tee validation/numerical.log
          PYTHONPATH="$PWD/research" python -W error::ResourceWarning -m unittest -v research/test_phase_innovation_study.py 2>&1 | tee validation/study-tests.log
      - name: Preserve existing scheduled tone and modulation thresholds
        if: matrix.compiler == 'gcc'
        run: |
          python research/check_execution_quality.py --build "$PWD/build-innovation" --output validation/tonal.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-innovation-${{ matrix.compiler }}-${{ github.sha }}
          path: validation/
          if-no-files-found: error
          retention-days: 7
