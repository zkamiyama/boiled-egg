name: research-replay-snapshot

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/research-replay-snapshot.yml"]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source and provenance
        shell: bash
        run: |
          mkdir replay
          git archive --format=tar.gz --prefix=boiled-egg/ HEAD > replay/source.tar.gz
          git rev-parse HEAD > replay/COMMIT.txt
          git rev-parse HEAD^{tree} > replay/TREE.txt
          git log -1 --format=fuller > replay/COMMIT_DETAILS.txt
          git ls-tree -r HEAD > replay/TRACKED_FILES.txt
          git ls-files -z | xargs -0 sha256sum > replay/SOURCE_SHA256SUMS
          (cd replay && sha256sum source.tar.gz COMMIT.txt TREE.txt COMMIT_DETAILS.txt TRACKED_FILES.txt SOURCE_SHA256SUMS > SHA256SUMS)
          printf 'Exact tracked research source only; no credentials, build outputs or local datasets.\nSOURCE_SHA256SUMS paths are relative to the repository root.\n' > replay/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: research-replay-${{ github.sha }}
          path: replay/
          if-no-files-found: error
          retention-days: 7
