name: spectral-backend-preview
on:
  push:
    paths: ['src/**', 'include/**', 'tests/**', 'tools/**', 'cmake/**', 'CMakeLists.txt', '.github/workflows/spectral-backend-preview.yml']
  pull_request:
    paths: ['src/**', 'include/**', 'tests/**', 'tools/**', 'cmake/**', 'CMakeLists.txt', '.github/workflows/spectral-backend-preview.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        spectral: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve exact source before validation
        run: |
          mkdir validation
          git archive --format=tar.gz --prefix=boiled-egg/ HEAD > validation/source.tar.gz
          git rev-parse HEAD > validation/COMMIT.txt
          git rev-parse HEAD^{tree} > validation/TREE.txt
          git ls-files -z | xargs -0 sha256sum > validation/SOURCE_SHA256SUMS
          (cd validation && sha256sum source.tar.gz COMMIT.txt TREE.txt SOURCE_SHA256SUMS > SHA256SUMS)
      - name: Build and test explicit backend configuration
        env:
          COMPILER: ${{ matrix.compiler }}
          SPECTRAL: ${{ matrix.spectral }}
        run: |
          if test "$COMPILER" = clang; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 \
            -DBOILED_EGG_ENABLE_EXPERIMENTAL_SPECTRAL="$SPECTRAL"
          cmake --build build -j 2 2>&1 | tee validation/build.log
          ctest --test-dir build --output-on-failure 2>&1 | tee validation/ctest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectral-${{ matrix.compiler }}-${{ matrix.spectral }}-${{ github.sha }}
          path: validation/
          retention-days: 7
          if-no-files-found: error
