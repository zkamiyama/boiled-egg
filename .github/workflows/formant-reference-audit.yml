name: formant-reference-audit
on:
  push:
    paths: ['eval/formant_audit/**', '.github/workflows/formant-reference-audit.yml']
  pull_request:
    paths: ['eval/**', '.github/workflows/formant-reference-audit.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
jobs:
  calibration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zkamiyama/boiled-egg
          ref: f8e5ef2cbce84f396597860a408b4a3084796115
          path: .pv-dependency
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build unchanged product and pinned preview dependency
        run: |
          mkdir validation
          sudo apt-get update
          sudo apt-get install -y libsndfile1 librubberband2
          python -m pip install numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1
          python -m pip freeze > validation/PYTHON_VERSIONS.txt
          dpkg-query -W librubberband2 libsndfile1 > validation/REFERENCE_VERSIONS.txt
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure 2>&1 | tee validation/product-tests.log
          cmake -S .pv-dependency -B build-pv -G Ninja -DCMAKE_BUILD_TYPE=Release -DBOILED_EGG_ENABLE_EXPERIMENTAL_SPECTRAL=ON
          cmake --build build-pv --target boiled_egg_backend_cli -j2
      - name: Independent metrics, policy and evidence calibration
        run: |
          python -W error::ResourceWarning -m unittest discover -s eval/formant_audit -p 'test_*.py' -v 2>&1 | tee validation/calibration.log
          python eval/formant_audit/study.py --spectral "$PWD/build-pv/boiled_egg_backend_cli" \
            --reference /usr/lib/x86_64-linux-gnu/librubberband.so.2 \
            --rates 48000 --output validation/formants
      - name: Preserve source and binary identities
        if: always()
        run: |
          mkdir -p validation
          git rev-parse HEAD > validation/COMMIT.txt
          git rev-parse HEAD^{tree} > validation/TREE.txt
          git archive --format=tar.gz --prefix=boiled-egg/ HEAD > validation/source.tar.gz
          git ls-files -z | xargs -0 sha256sum > validation/SOURCE_SHA256SUMS
          git -C .pv-dependency rev-parse HEAD > validation/PV_COMMIT.txt
          if test -f build-pv/boiled_egg_backend_cli; then sha256sum build-pv/boiled_egg_backend_cli build-pv/libboiled_egg.so > validation/PV_BINARIES_SHA256SUMS; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formant-reference-${{ matrix.python }}-${{ github.sha }}
          path: |
            validation/
            !validation/formants/cases/**/output.wav
          if-no-files-found: error
          retention-days: 7
