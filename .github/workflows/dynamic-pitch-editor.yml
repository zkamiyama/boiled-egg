name: dynamic-pitch-editor
on:
  push:
    paths: ['src/**', 'include/**', 'tests/**', 'adapters/**', 'cmake/**', 'CMakeLists.txt', 'quality/dynamic_pitch/**', '.github/workflows/dynamic-pitch-editor.yml']
  pull_request:
    paths: ['src/**', 'include/**', 'tests/**', 'adapters/**', 'cmake/**', 'CMakeLists.txt', 'quality/dynamic_pitch/**', '.github/workflows/dynamic-pitch-editor.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
jobs:
  dynamic-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and test dynamic public SDK
        run: |
          mkdir validation
          python -m pip install numpy scipy soundfile
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBOILED_EGG_ENABLE_EXPERIMENTAL_SPECTRAL=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure | tee validation/ctest.log
          python -m unittest discover -s quality/dynamic_pitch -p 'test_*.py' -v 2>&1 | tee validation/python.log
          python quality/dynamic_pitch/evaluate.py --library "$PWD/build/libboiled_egg.so" --output validation/analytic --workers 2
      - name: Fixed empirical capacity policy, retain every sample
        run: |
          for r in 1 2 3; do build/boiled_egg_dynamic_pitch_bench "$r" > "validation/bench-$r.csv"; done
          python quality/dynamic_pitch/summarize_bench.py --csv validation/bench-1.csv validation/bench-2.csv validation/bench-3.csv --output validation/capacity.json
      - name: Exact source and library identity
        if: always()
        run: |
          mkdir -p validation
          git archive --format=tar.gz --prefix=boiled-egg/ HEAD > validation/source.tar.gz
          git rev-parse HEAD > validation/COMMIT.txt
          git rev-parse HEAD^{tree} > validation/TREE.txt
          git ls-files -z | xargs -0 sha256sum > validation/SOURCE_SHA256SUMS
          test ! -f build/libboiled_egg.so || sha256sum build/libboiled_egg.so > validation/LIBRARY_SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-core-${{ github.sha }}
          path: validation/
          retention-days: 7
          if-no-files-found: error
  loaded-editors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native GUI dependencies and pinned host SDKs
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev xvfb xauth xfonts-base xfonts-75dpi
          mkdir -p deps validation
          git clone --filter=blob:none --no-checkout https://github.com/free-audio/clap.git deps/clap
          git -C deps/clap checkout 195b42a004144fab0b3cf95e9c067187d15365b7
          git clone --filter=blob:none --no-checkout https://github.com/steinbergmedia/vst3sdk.git deps/vst3sdk
          git -C deps/vst3sdk checkout 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0
          git -C deps/vst3sdk submodule update --init --depth 1 base cmake pluginterfaces public.sdk
          git -C deps/clap rev-parse HEAD > validation/CLAP_COMMIT.txt
          git -C deps/vst3sdk rev-parse HEAD > validation/VST3_COMMIT.txt
          git -C deps/vst3sdk submodule status > validation/VST3_SUBMODULES.txt
          tar --exclude=.git -czf validation/pinned-host-sources.tar.gz -C deps clap vst3sdk
      - name: Build actual plugin modules and validator
        run: |
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DBOILED_EGG_BUILD_SHARED=OFF \
            -DBOILED_EGG_ENABLE_EXPERIMENTAL_SPECTRAL=ON -DBOILED_EGG_BUILD_CLAP=ON -DBOILED_EGG_BUILD_VST3=ON \
            -DFETCHCONTENT_SOURCE_DIR_CLAP_HEADERS="$PWD/deps/clap" -DFETCHCONTENT_SOURCE_DIR_VST3SDK="$PWD/deps/vst3sdk"
          cmake --build build-host -j2 2>&1 | tee validation/build-validator.log
          ctest --test-dir build-host --output-on-failure 2>&1 | tee validation/loaded-tests.log
          readelf -d build-host/adapters/clap/boiled_egg.clap > validation/clap-dependencies.log
          readelf -d 'build-host/VST3/Release/boiled egg.vst3/Contents/x86_64-linux/boiled egg.so' > validation/vst3-dependencies.log
          if grep -q libboiled_egg validation/clap-dependencies.log validation/vst3-dependencies.log; then
            echo 'Plugin unexpectedly requires a separate SDK library' >&2; exit 1
          fi
          cp build-host/adapters/clap/boiled_egg.clap validation/
          tar -czf validation/boiled-egg-vst3.tar.gz -C build-host/VST3/Release 'boiled egg.vst3'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-loaded-editors-${{ github.sha }}
          path: validation/
          retention-days: 7
          if-no-files-found: error
